[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "scan2bim"
version = "0.1.0"
description = "Spybee Scan2BIM pipeline: point cloud -> building.json -> IFC / Revit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - Spybee. All rights reserved." }
authors = [{ name = "Spybee" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "laspy[lazrs]>=2.5",
  "pye57>=0.4",
  "open3d>=0.18",
  "shapely>=2.0",
  "pyproj>=3.6",
  "scikit-image>=0.22",
  "opencv-python-headless>=4.9",
  "scikit-learn>=1.4",
  "ifcopenshell>=0.8",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "matplotlib>=3.8",
  "psutil>=5.9",
  "tqdm>=4.66",
]

[project.scripts]
scan2bim = "scan2bim.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scan2bim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "slow: takes more than a few seconds",
  "realdata: needs a real point cloud under data/raw (never runs in CI)",
  "open3d: needs open3d with a working graphics stack",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PTH", "RUF", "N"]
ignore = [
  "E501",   # line length is handled by the formatter
  "N803",   # allow math-style argument names (e.g. X, Y)
  "N806",   # allow math-style local names
  "RUF001", # allow unicode in strings (units, symbols)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
packages = ["scan2bim"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["scan2bim"]
branch = true
